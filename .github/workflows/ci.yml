name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build and test with MSVC
        shell: pwsh
        run: ./build.ps1 -Test
      - name: Test Windows installer
        shell: pwsh
        run: python tests/install_test.py
      - name: Note game tests skipped
        shell: pwsh
        run: Write-Output '::warning::No EDF.dll in CI. CameraSwitchWithGameCode and PluginLoadsIntoGame are skipped. Release packaging requires both tests with the installed game.'
  installers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test Bash and PowerShell installers
        run: python3 tests/install_test.py
